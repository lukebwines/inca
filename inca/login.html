<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accedi · INCA</title><style>body{font:16px system-ui;background:#f2f5f8;color:#203348;margin:0;display:grid;min-height:100vh;place-items:center}main{background:white;padding:32px;border-radius:12px;width:min(360px,80vw)}h1{color:#167d88}label{display:block;margin:16px 0}input,button{box-sizing:border-box;width:100%;padding:12px;font:inherit;border:1px solid #bacbd5;border-radius:6px;margin-top:5px}button{background:#167d88;color:white;cursor:pointer}#error{color:#a02525}small{color:#657a89}</style><main><h1>INCA</h1><p>Affidamenti didattici</p><form id="login"><label>Nome utente<input name="username" autocomplete="username" required maxlength="64"></label><label>Password<input name="password" type="password" autocomplete="current-password" required maxlength="1024"></label><button>Accedi</button><p id="error" role="alert"></p></form><small>Per ottenere un account o recuperare la password, contatta l’amministratore INCA.</small></main><script>document.querySelector('#login').onsubmit=async e=>{e.preventDefault();let button=e.target.querySelector('button');button.disabled=true;try{let data=Object.fromEntries(new FormData(e.target));let r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});let j=await r.json();if(!r.ok)throw Error(j.error);location.replace('/')}catch(err){document.querySelector('#error').textContent=err.message}finally{button.disabled=false}};</script></html>
