<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="__BASE__"><title>INCA · Affidamenti didattici</title><style>
:root{font:15px system-ui;color:#203348;background:#f2f5f8}*{box-sizing:border-box}body{margin:0}header{background:#13364a;color:white;padding:22px 32px;display:flex;justify-content:space-between;align-items:center}h1{font-size:24px;margin:0}header small{color:#b8d3df}main{padding:24px;max-width:1600px;margin:auto}button,.upload{border:0;background:#167d88;color:white;padding:10px 15px;border-radius:6px;cursor:pointer;font:inherit}button.secondary{background:#e2ebef;color:#203348}input,select,textarea{padding:9px;border:1px solid #b9c9d3;border-radius:5px;font:inherit;max-width:100%}input[type=checkbox]{width:18px;height:18px}.panel{background:white;border:1px solid #dbe4eb;border-radius:10px;padding:20px;margin-bottom:18px}.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:16px 0}label{font-size:13px;display:block}label input,label select{display:block;width:100%;margin-top:5px}table{border-collapse:collapse;width:100%;font-size:13px}th{text-align:left;background:#eaf0f5;position:sticky;top:0}td,th{padding:10px;border-bottom:1px solid #e2e8ed;vertical-align:top}tr:hover{background:#f7fafc}.scroll{overflow:auto;max-height:58vh}.muted{color:#657a89;font-size:13px}.changed{background:#fff0bb}.warning{background:#fff3d7;padding:10px;border-radius:5px;margin:8px 0}#msg{padding:12px;position:sticky;top:0;z-index:4;background:#e0f1ef;display:none}dialog{width:min(1000px,95vw);border:0;border-radius:12px;max-height:90vh}dialog::backdrop{background:#152b4080}.editgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}details{margin:12px 0}.pill{background:#e2ebef;border-radius:10px;padding:3px 8px}@media print{header,nav,.noprint,#msg{display:none!important}main{padding:0}.panel{border:0;padding:0}.scroll{max-height:none;overflow:visible}th{position:static}tr{break-inside:avoid}body{background:white}button{display:none}h2{font-size:19px}}
.multifilter{margin:0;border:1px solid #b9c9d3;border-radius:5px;padding:10px;min-width:0}.multifilter summary{cursor:pointer;font-size:13px}.multifilter summary span{display:block;margin-top:5px}.choices{max-height:230px;overflow:auto;padding-top:10px}.choices label{display:flex;align-items:center;gap:8px;padding:6px 0;overflow-wrap:anywhere}.choices label input{flex-shrink:0;width:18px;margin:0}.choices button{font-size:12px;padding:6px;margin-bottom:6px}</style><header><div><h1>INCA</h1><small>Affidamenti didattici · Proposte di variazione</small></div><span>Home Assistant</span></header><main><div id="msg" role="status"></div><nav class="bar" style="margin-bottom:18px"><button onclick="archive()">Archivio e filtri</button><button class="secondary" onclick="practices()">Pratiche salvate</button><button class="secondary" onclick="backup()">Scarica backup</button></nav><div id="view"></div></main><dialog id="editor"></dialog><script>
const TOKEN='__TOKEN__';let S={},rows=[],selected=new Set(),page=0,active=null,current=null,dirty=false;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function message(s,error=false){let e=document.querySelector('#msg');e.textContent=s;e.style.display='block';e.style.background=error?'#ffe5df':'#e0f1ef'}
async function api(path,data={}){let r=await fetch(path.replace(/^\//,''),{method:'POST',headers:{'X-Token':TOKEN,'Content-Type':'application/json'},body:JSON.stringify(data)});let j=await r.json();if(!r.ok)throw Error(j.error);return j}
function safe(fn){return fn().catch(e=>message(e.message,true))}window.addEventListener('unhandledrejection',e=>{message(e.reason.message||e.reason,true);e.preventDefault()});
const cols=['ANNO ACCADEMICO','TIPOLOGIA','SEDE CORSO','CODICE CORSO','CDS','INSEGNAMENTO','MODULO','UL','COGNOME DOCENTE','NOME DOCENTE','TOT ORE PREVISTE','MUTUAZIONE','ID COPERTURA'];
let filterSelections=[];
const filters=['ANNO ACCADEMICO','DIPARTIMENTO (DI RIFERIMENTO)','SCUOLA','TIPOLOGIA','SEDE CORSO','CODICE CORSO','CDS','SSD INSEGNAMENTO','TAF INSEGNAMENTO','TITOLO AFFIDAMENTO','MUTUAZIONE'];
async function archive(){S=await api('/state');document.querySelector('#view').innerHTML=`<section class="panel"><h2>Archivio delle coperture</h2><p class="muted">Ogni importazione resta separata. Le proposte non modificano i dati originali.</p><div class="bar"><label class="upload">Importa .xls<input type="file" accept=".xls" style="display:none" onchange="upload(this)"></label><select id="source" onchange="loadRows()">${S.imports.map(i=>`<option value="${i.id}">${esc(i.name)} · ${esc(i.created)}</option>`).join('')}</select></div><div id="filterbox"></div></section><section class="panel"><div class="bar"><strong id="count"></strong><button onclick="createPractice()">Crea pratica dalle righe selezionate</button><button class="secondary" onclick="selected.clear();renderRows()">Azzera selezione</button></div><p id="activefilters" class="muted"></p><div id="emptyresults" class="warning" hidden></div><div class="scroll" id="table"></div><div class="bar" style="margin-top:12px"><button class="secondary" onclick="page=Math.max(0,page-1);renderRows()">Precedenti</button><span id="pagination"></span><button class="secondary" onclick="page++;renderRows()">Successive</button></div></section>`;await loadRows()}
async function upload(input){if(!input.files.length)return;message('Importazione in corso…');let f=input.files[0],r=await fetch('import',{method:'POST',headers:{'X-Token':TOKEN,'X-Name':encodeURIComponent(f.name)},body:f});let j=await r.json();if(!r.ok)throw Error(j.error);await archive();message(`${j.count} righe importate. Nessuna modifica applicata.`)}
async function loadRows(){let v=document.querySelector('#source').value;rows=v?await api('/records',{import_id:+v}):[];selected.clear();filterSelections=filters.map(()=>new Set());page=0;document.querySelector('#filterbox').innerHTML=`<label style="margin-top:14px">Ricerca libera (docente, modulo, codice, ID…)<input id="search" oninput="page=0;renderRows()" placeholder="Cerca insegnamento, modulo o docente"></label><p class="muted">Apri un filtro e spunta una o più voci. Nessuna spunta = tutti i valori.</p><div class="filters">${filters.map((k,i)=>`<details class="multifilter"><summary>${esc(k)}<span id="fsummary${i}" class="muted">Tutti</span></summary><div class="choices"><button class="secondary" onclick="clearFilter(${i})">Tutti / azzera</button>${[...new Set(rows.map(r=>filterValue(r[k])))].sort((a,b)=>a.localeCompare(b,'it')).map(v=>`<label><input type="checkbox" data-filter="${i}" value="${esc(v)}" onchange="toggleFilter(${i},this.value,this.checked)"><span>${esc(v)||'(Non compilato)'}</span></label>`).join('')}</div></details>`).join('')}</div><div class="bar"><button class="secondary" onclick="resetFilters()">Azzera filtri</button><button class="secondary" onclick="selectFiltered()">Seleziona tutti i risultati</button><span class="muted">Cerca un insegnamento e seleziona le righe interessate.</span></div>`;renderRows()}
function filterValue(v){return String(v??'').replace(/\s+/g,' ').trim()}
function toggleFilter(i,value,checked){let values=filterSelections[i];checked?values.add(value):values.delete(value);updateFilterSummary(i);page=0;renderRows()}
function updateFilterSummary(i){let values=filterSelections[i];document.querySelector('#fsummary'+i).textContent=values.size?values.size+' selezionati':'Tutti'}
function clearFilter(i){filterSelections[i].clear();document.querySelectorAll('input[data-filter="'+i+'"]').forEach(e=>e.checked=false);updateFilterSummary(i);page=0;renderRows()}
function filtered(){let q=filterValue(document.querySelector('#search').value).toLowerCase();return rows.filter(r=>(!q||Object.values(r).some(v=>filterValue(v).toLowerCase().includes(q)))&&filters.every((k,i)=>!filterSelections[i]?.size||filterSelections[i].has(filterValue(r[k]))))}
function resetFilters(){document.querySelector('#search').value='';filterSelections=filters.map(()=>new Set());document.querySelectorAll('input[data-filter]').forEach(e=>e.checked=false);filters.forEach((k,i)=>updateFilterSummary(i));page=0;renderRows()}
function activeFilters(){let values=filters.map((k,i)=>{let v=[...(filterSelections[i]||[])];return v.length?k+': '+v.map(x=>x||'(Non compilato)').join(' oppure '):''}).filter(Boolean);let q=document.querySelector('#search').value.trim();if(q)values.unshift('Ricerca: '+q);return values}
function selectFiltered(){filtered().forEach(r=>selected.add(r.id));renderRows()}
function renderRows(){let rr=filtered();let applied=activeFilters();document.querySelector('#activefilters').textContent=applied.length?'Filtri attivi (alternative nello stesso filtro; tutti i filtri devono corrispondere): '+applied.join(' · '):'Nessun filtro attivo';let empty=document.querySelector('#emptyresults');empty.hidden=rr.length>0;empty.textContent=rows.length?'Nessun risultato per questa combinazione. Controlla i filtri attivi, in particolare SSD, corso e dipartimento, oppure usa Azzera filtri.':'Nessuna riga disponibile: importa un archivio XLS.';page=Math.min(page,Math.max(0,Math.ceil(rr.length/60)-1));document.querySelector('#count').textContent=`${rr.length} risultati · ${selected.size} selezionati`;document.querySelector('#pagination').textContent=`Pagina ${page+1} di ${Math.max(1,Math.ceil(rr.length/60))}`;document.querySelector('#table').innerHTML=`<table><thead><tr><th>Seleziona</th>${cols.map(k=>`<th>${esc(k)}</th>`).join('')}</tr></thead><tbody>${rr.slice(page*60,page*60+60).map(r=>`<tr><td><input aria-label="Seleziona riga ${r.line}" type="checkbox" ${selected.has(r.id)?'checked':''} onchange="this.checked?selected.add(${r.id}):selected.delete(${r.id});document.querySelector('#count').textContent='${rr.length} risultati · '+selected.size+' selezionati'"></td>${cols.map(k=>`<td>${esc(r[k])}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
async function createPractice(){if(!selected.size)return message('Seleziona almeno un incarico.',true);let title=prompt('Titolo della pratica');if(!title?.trim())return;let notes=prompt('Motivazione o note della proposta (facoltative)')||'';let p=await api('/create',{title,notes,ids:[...selected]});await openPractice(p.id)}
async function practices(){S=await api('/state');document.querySelector('#view').innerHTML=`<section class="panel"><h2>Pratiche salvate</h2><p class="muted">Proposte di lavoro, senza approvazione automatica né aggiornamento del sistema di Ateneo.</p>${S.practices.length?S.practices.map(p=>`<div class="bar" style="padding:12px;border-bottom:1px solid #eee"><button onclick="openPractice(${p.id})">${esc(p.title)}</button><span>${esc(p.created)}</span><span class="muted">${esc(p.notes)}</span></div>`).join(''):'Nessuna pratica. Seleziona gli incarichi nell’archivio.'}</section>`}
function diff(x){return [...new Set([...Object.keys(x.before),...Object.keys(x.after)])].filter(k=>String(x.before[k]??'')!==String(x.after[k]??''))}
async function openPractice(id){active=await api('/practice',{id});drawPractice()}
function drawPractice(){document.querySelector('#view').innerHTML=`<section class="panel"><h2>${esc(active.practice.title)}</h2><p>${esc(active.practice.notes)}</p><p class="muted">Proposta di modifica · Originale importato conservato · ${esc(active.practice.created)}</p><div class="bar noprint"><button onclick="window.print()">Stampa / Salva PDF</button><button class="secondary" onclick="exportCSV()">Esporta confronto CSV per Excel</button><label><input id="only" type="checkbox" onchange="drawItems()"> Solo campi modificati</label></div></section><div id="items"></div>`;drawItems()}
function drawItems(){let only=document.querySelector('#only').checked;document.querySelector('#items').innerHTML=active.items.map(x=>{let changed=diff(x),keys=only?changed:[...new Set([...S.edit,...changed])];return `<section class="panel"><div class="bar"><h3>${esc(x.before.MODULO||x.before.INSEGNAMENTO)}</h3><span class="pill">${changed.length} campi modificati</span><button onclick="edit(${x.id})">Modifica proposta</button></div><p>${esc(x.before.CDS)} · ${esc(x.before['ANNO ACCADEMICO'])}<br><span class="muted">${esc(x.before.INSEGNAMENTO)} · UL: ${esc(x.before.UL||'—')} · ID copertura: ${esc(x.before['ID COPERTURA']||'assente')}</span></p>${x.warnings.map(w=>`<div class="warning">${esc(w)}</div>`).join('')}<table><thead><tr><th style="width:30%">Campo</th><th style="width:35%">Prima · Originale</th><th>Dopo · Proposta</th></tr></thead><tbody>${keys.map(k=>`<tr class="${changed.includes(k)?'changed':''}"><td>${esc(k)}</td><td>${esc(x.before[k]??'')||'—'}</td><td>${esc(x.after[k]??'')||'—'}</td></tr>`).join('')||'<tr><td colspan="3">Nessuna differenza inserita.</td></tr>'}</tbody></table><details class="noprint"><summary>Storico salvataggi (${x.history.length})</summary>${x.history.map(h=>`<details><summary>${esc(h.created)} · proposta precedente</summary><pre style="white-space:pre-wrap">${esc(JSON.stringify(JSON.parse(h.body),null,2))}</pre></details>`).join('')||'Nessun salvataggio precedente.'}</details></section>`}).join('')}
function edit(id){current=active.items.find(x=>x.id===id);dirty=false;let d=document.querySelector('#editor');d.innerHTML=`<h2>Modifica proposta</h2><p>${esc(current.before.MODULO||current.before.INSEGNAMENTO)}</p><div class="bar"><button type="button" onclick="unlink()">Togli mutuazione e prepara bando</button><span class="muted">Il titolo di affidamento va scelto esplicitamente.</span></div><p class="warning">I campi vuoti restano vuoti. Quando cambi docente verifica anche nome, cognome, matricola, codice fiscale e afferenza. Nessun dato anagrafico viene aggiornato automaticamente.</p><form id="form"><div class="editgrid">${S.edit.map((k,i)=>`<label>${esc(k)}<input id="e${i}" ${k.startsWith('PERIODO ')?'type="date"':''} value="${esc(current.after[k]??'')}" oninput="dirty=true" ${k==='COGNOME DOCENTE'?'list="teachers"':''}></label>`).join('')}</div><datalist id="teachers">${[...new Set(rows.map(r=>r['COGNOME DOCENTE']).filter(Boolean))].sort().map(v=>`<option value="${esc(v)}">`).join('')}</datalist><p class="muted">Mutuazione: 1 = sì, 0 = no. Ore e CFU: numeri non negativi. I totali non vengono corretti automaticamente.</p><div class="bar"><button type="submit">Salva proposta</button><button type="button" class="secondary" onclick="closeEditor()">Annulla</button><span id="editerror" role="alert"></span></div></form>`;d.showModal();document.querySelector('#form').onsubmit=async e=>{e.preventDefault();try{let values={};S.edit.forEach((k,i)=>values[k]=document.querySelector('#e'+i).value);await api('/save',{id:current.id,version:current.version,values});dirty=false;d.close();await openPractice(active.practice.id);message('Proposta salvata in INCA.');}catch(err){document.querySelector('#editerror').textContent=err.message}}}
function unlink(){const set=(k,v)=>document.querySelector('#e'+S.edit.indexOf(k)).value=v;set('MUTUAZIONE','0');set('PADRE MUTUAZIONE','');set('NOME DOCENTE','');set('COGNOME DOCENTE','');set('MATRICOLA DOCENTE','');set('CF DOCENTE','');set('DIPARTIMENTO AFFERENZA DOCENTE','');set('NOTE','Copertura da assegnare tramite bando. Docente, ore, CFU e titolo di affidamento [DA VERIFICARE].');dirty=true}
function closeEditor(){if(!dirty||confirm('Chiudere senza salvare le modifiche?')){dirty=false;document.querySelector('#editor').close()}}
document.querySelector('#editor').addEventListener('cancel',e=>{e.preventDefault();closeEditor()});window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
function download(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function exportCSV(){let lines=[['Pratica','ID copertura','CDS','Insegnamento','Modulo','Campo','Prima','Dopo','Modificato']];active.items.forEach(x=>{let keys=[...new Set([...S.edit,...diff(x)])];keys.forEach(k=>lines.push([active.practice.title,x.before['ID COPERTURA'],x.before.CDS,x.before.INSEGNAMENTO,x.before.MODULO,k,x.before[k],x.after[k],diff(x).includes(k)?'SI':'NO']))});let cell=v=>{let s=String(v??'');if(/^[=+@\-\t\r]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"'};download(new Blob(['\ufeff'+lines.map(l=>l.map(cell).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'}),'Confronto_pratica_'+active.practice.id+'.csv')}
async function backup(){let r=await fetch('backup',{method:'POST',headers:{'X-Token':TOKEN},body:'{}'});if(!r.ok)throw Error('Backup non riuscito');download(await r.blob(),'Backup_INCA.zip');message('Backup scaricato: conserva lo ZIP in una cartella sicura.')}
archive();
</script></html>
