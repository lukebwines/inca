<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="__BASE__"><title>INCA · Affidamenti didattici</title><style>
[hidden]{display:none!important}:root{font:15px system-ui;color:#203348;background:#f2f5f8}*{box-sizing:border-box}body{margin:0}header{background:#13364a;color:white;padding:22px 32px;display:flex;justify-content:space-between;align-items:center}h1{font-size:24px;margin:0}header small{color:#b8d3df}main{padding:24px;max-width:1600px;margin:auto}button,.upload{border:0;background:#167d88;color:white;padding:10px 15px;border-radius:6px;cursor:pointer;font:inherit}button.secondary{background:#e2ebef;color:#203348}input,select,textarea{padding:9px;border:1px solid #b9c9d3;border-radius:5px;font:inherit;max-width:100%}input[type=checkbox]{width:18px;height:18px}.panel{background:white;border:1px solid #dbe4eb;border-radius:10px;padding:20px;margin-bottom:18px}.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:16px 0}label{font-size:13px;display:block}label input,label select{display:block;width:100%;margin-top:5px}table{border-collapse:collapse;width:100%;font-size:13px}th{text-align:left;background:#eaf0f5;position:sticky;top:0}td,th{padding:10px;border-bottom:1px solid #e2e8ed;vertical-align:top}tr:hover{background:#f7fafc}.scroll{overflow:auto;max-height:58vh}.muted{color:#657a89;font-size:13px}.changed{background:#fff0bb}.warning{background:#fff3d7;padding:10px;border-radius:5px;margin:8px 0}#msg{padding:12px;position:sticky;top:0;z-index:4;background:#e0f1ef;display:none}dialog{width:min(1000px,95vw);border:0;border-radius:12px;max-height:90vh}dialog::backdrop{background:#152b4080}.editgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}details{margin:12px 0}.pill{background:#e2ebef;border-radius:10px;padding:3px 8px}@media print{header,nav,.noprint,#msg{display:none!important}main{padding:0}.panel{border:0;padding:0}.scroll{max-height:none;overflow:visible}th{position:static}tr{break-inside:avoid}body{background:white}button{display:none}h2{font-size:19px}}
.multifilter{margin:0;border:1px solid #b9c9d3;border-radius:5px;padding:10px;min-width:0}.multifilter summary{cursor:pointer;font-size:13px}.multifilter summary span{display:block;margin-top:5px}.filtersearch{width:100%;margin-top:10px}.choices{max-height:230px;overflow:auto;padding-top:10px}.choices label[hidden]{display:none}.choices label{display:flex;align-items:center;gap:8px;padding:6px 0;overflow-wrap:anywhere}.choices label input{flex-shrink:0;width:18px;margin:0}.choices button{font-size:12px;padding:6px;margin-bottom:6px}</style><header><div><h1>INCA</h1><small>Affidamenti didattici · Proposte di variazione</small></div><span>Home Assistant</span></header><main><div id="msg" role="status"></div><nav class="bar" style="margin-bottom:18px"><button onclick="archive()">Archivio e filtri</button><button class="secondary" onclick="practices()">Pratiche salvate</button><button class="secondary" onclick="teachersPage()">Docenti e carichi</button><button id="backupbutton" class="secondary" onclick="backup()">Scarica backup</button><span id="accountmenu" class="bar"></span></nav><div id="view"></div></main><dialog id="editor"></dialog><script>
const TOKEN='__TOKEN__';let S={},rows=[],selected=new Set(),page=0,active=null,current=null,dirty=false;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function message(s,error=false){let e=document.querySelector('#msg');e.textContent=s;e.style.display='block';e.style.background=error?'#ffe5df':'#e0f1ef'}
async function api(path,data={}){let r=await fetch(path.replace(/^\//,''),{method:'POST',headers:{'X-Token':TOKEN,'Content-Type':'application/json'},body:JSON.stringify(data)});let j=await r.json();if(!r.ok)throw Error(j.error);return j}
function safe(fn){return fn().catch(e=>message(e.message,true))}window.addEventListener('unhandledrejection',e=>{message(e.reason.message||e.reason,true);e.preventDefault()});
const cols=['ANNO ACCADEMICO','TIPOLOGIA','SEDE CORSO','CODICE CORSO','CDS','INSEGNAMENTO','MODULO','UL','COGNOME DOCENTE','NOME DOCENTE','TOT ORE PREVISTE','MUTUAZIONE','ID COPERTURA'];
let filterSelections=[];
const filters=['DIPARTIMENTO (DI RIFERIMENTO)','TIPOLOGIA','SEDE CORSO','CODICE CORSO','CDS','INSEGNAMENTO','MODULO','MUTUAZIONE','TAF INSEGNAMENTO','SSD INSEGNAMENTO','NOME DOCENTE','COGNOME DOCENTE','TITOLO AFFIDAMENTO'];
async function archive(){S=await api('/state');accountMenu();document.querySelector('#view').innerHTML=`<section class="panel"><h2>Archivio delle coperture</h2><p class="muted">Sono visibili soltanto i codici corso MM? (tre caratteri), MM?? oppure M??R (quattro caratteri). Il nuovo report sostituisce il precedente. Le pratiche salvate conservano i propri originali e le proposte.</p><div class="bar"><label class="upload" ${S.auth?.role==='operator'?'hidden':''}>Importa .xls<input type="file" accept=".xls" style="display:none" onchange="upload(this)"></label><select id="source" onchange="loadRows()">${S.imports.map(i=>`<option value="${i.id}">${esc(i.name)} · ${esc(i.created)}</option>`).join('')}</select></div><div id="filterbox"></div></section><section class="panel"><div class="bar"><strong id="count"></strong><button onclick="createPractice()">Crea pratica dalle righe selezionate</button><button class="secondary" onclick="selected.clear();renderRows()">Azzera selezione</button></div><p id="activefilters" class="muted"></p><div id="emptyresults" class="warning" hidden></div><div class="scroll" id="table"></div><div class="bar" style="margin-top:12px"><button class="secondary" onclick="page=Math.max(0,page-1);renderRows()">Precedenti</button><span id="pagination"></span><button class="secondary" onclick="page++;renderRows()">Successive</button></div></section>`;await loadRows()}
async function upload(input){if(!input.files.length)return;message('Importazione in corso…');let f=input.files[0],r=await fetch('import',{method:'POST',headers:{'X-Token':TOKEN,'X-Name':encodeURIComponent(f.name)},body:f});let j=await r.json();if(!r.ok)throw Error(j.error);await archive();message(`${j.count} righe importate. Report attivo sostituito; pratiche salvate conservate.`)}
async function loadRows(){let v=document.querySelector('#source').value;rows=v?await api('/records',{import_id:+v}):[];selected.clear();filterSelections=filters.map(()=>new Set());page=0;document.querySelector('#filterbox').innerHTML=`<label style="margin-top:14px">Ricerca libera (docente, modulo, codice, ID…)<input id="search" oninput="page=0;renderRows()" placeholder="Cerca insegnamento, modulo o docente"></label><p class="muted">Apri un filtro e spunta una o più voci. Nessuna spunta = tutti i valori. Cerca le voci digitando le prime lettere, poi spuntale per applicare il filtro. Gli elenchi si aggiornano in base agli altri filtri e alla ricerca libera.</p><div class="filters">${filters.map((k,i)=>`<details class="multifilter"><summary>${esc(k)}<span id="fsummary${i}" class="muted">Tutti</span></summary><input class="filtersearch" id="fsearch${i}" type="search" aria-label="Cerca in ${esc(k)}" placeholder="Scrivi le prime lettere…" oninput="updateFilterOptions()"><div class="choices" id="choices${i}"><button class="secondary" onclick="clearFilter(${i})">Tutti / azzera</button>${[...new Set(rows.map(r=>filterValue(r[k])))].sort((a,b)=>a.localeCompare(b,'it')).map(v=>`<label><input type="checkbox" data-filter="${i}" value="${esc(v)}" onchange="toggleFilter(${i},this.value,this.checked)"><span>${esc(v)||'(Non compilato)'}</span></label>`).join('')}<p id="fempty${i}" class="muted" hidden>Nessun valore compatibile.</p></div></details>`).join('')}</div><div class="bar"><button class="secondary" onclick="resetFilters()">Azzera filtri</button><button class="secondary" onclick="selectFiltered()">Seleziona tutti i risultati</button><span class="muted">Cerca un insegnamento e seleziona le righe interessate.</span></div>`;renderRows()}
function filterValue(v){return String(v??'').replace(/\s+/g,' ').trim()}
function toggleFilter(i,value,checked){let values=filterSelections[i];checked?values.add(value):values.delete(value);updateFilterSummary(i);page=0;renderRows()}
function updateFilterSummary(i){let values=filterSelections[i];document.querySelector('#fsummary'+i).textContent=values.size?values.size+' selezionati':'Tutti'}
function clearFilter(i){document.querySelector('#fsearch'+i).value='';filterSelections[i].clear();document.querySelectorAll('input[data-filter="'+i+'"]').forEach(e=>e.checked=false);updateFilterSummary(i);page=0;renderRows()}
// Each facet ignores its own selection so additional OR choices remain available.
function facetOptions(){
 const q=filterValue(document.querySelector('#search').value).toLowerCase();
 const options=filters.map(()=>new Set());
 for(const r of rows){
  if(q&&!Object.values(r).some(v=>filterValue(v).toLowerCase().includes(q)))continue;
  const values=filters.map(k=>filterValue(r[k]));let failed=-1,multiple=false;
  for(let i=0;i<filters.length;i++)if(filterSelections[i]?.size&&!filterSelections[i].has(values[i])){if(failed!==-1){multiple=true;break}failed=i}
  if(multiple)continue;
  if(failed!==-1)options[failed].add(values[failed]);
  else values.forEach((v,i)=>options[i].add(v));
 }
 return options;
}
function searchKey(v){return filterValue(v).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
function updateFilterOptions(){
 const options=facetOptions();
 filters.forEach((k,i)=>{
  const query=searchKey(document.querySelector('#fsearch'+i).value);let shown=0;
  document.querySelectorAll('input[data-filter="'+i+'"]').forEach(input=>{
   const checked=filterSelections[i]?.has(input.value)||false,available=options[i].has(input.value);
   const visible=(checked||available)&&searchKey(input.value||'(Non compilato)').startsWith(query);
   input.checked=checked;input.closest('label').hidden=!visible;if(visible)shown++;
   input.nextElementSibling.textContent=(input.value||'(Non compilato)')+(checked&&!available?' — nessuna corrispondenza':'');
  });
  const empty=document.querySelector('#fempty'+i);empty.hidden=shown>0;empty.textContent=query?'Nessuna voce corrisponde alle lettere inserite.':'Nessun valore compatibile.';
 });
}
function filtered(){let q=filterValue(document.querySelector('#search').value).toLowerCase();return rows.filter(r=>(!q||Object.values(r).some(v=>filterValue(v).toLowerCase().includes(q)))&&filters.every((k,i)=>!filterSelections[i]?.size||filterSelections[i].has(filterValue(r[k]))))}
function resetFilters(){document.querySelector('#search').value='';filterSelections=filters.map(()=>new Set());document.querySelectorAll('input[data-filter]').forEach(e=>e.checked=false);filters.forEach((k,i)=>{document.querySelector('#fsearch'+i).value='';updateFilterSummary(i)});page=0;renderRows()}
function activeFilters(){let values=filters.map((k,i)=>{let v=[...(filterSelections[i]||[])];return v.length?k+': '+v.map(x=>x||'(Non compilato)').join(' oppure '):''}).filter(Boolean);let q=document.querySelector('#search').value.trim();if(q)values.unshift('Ricerca: '+q);return values}
function selectFiltered(){filtered().forEach(r=>selected.add(r.id));renderRows()}
function renderRows(){updateFilterOptions();let rr=filtered();let applied=activeFilters();document.querySelector('#activefilters').textContent=applied.length?'Filtri attivi (alternative nello stesso filtro; tutti i filtri devono corrispondere): '+applied.join(' · '):'Nessun filtro attivo';let empty=document.querySelector('#emptyresults');empty.hidden=rr.length>0;empty.textContent=rows.length?'Nessun risultato per questa combinazione. Controlla i filtri attivi, in particolare SSD, corso e dipartimento, oppure usa Azzera filtri.':'Nessuna riga con codice corso MM?, MM?? o M??R disponibile in questo archivio.';page=Math.min(page,Math.max(0,Math.ceil(rr.length/60)-1));document.querySelector('#count').textContent=`${rr.length} risultati · ${selected.size} selezionati`;document.querySelector('#pagination').textContent=`Pagina ${page+1} di ${Math.max(1,Math.ceil(rr.length/60))}`;document.querySelector('#table').innerHTML=`<table><thead><tr><th>Seleziona</th>${cols.map(k=>`<th>${esc(k)}</th>`).join('')}</tr></thead><tbody>${rr.slice(page*60,page*60+60).map(r=>`<tr><td><input aria-label="Seleziona riga ${r.line}" type="checkbox" ${selected.has(r.id)?'checked':''} onchange="this.checked?selected.add(${r.id}):selected.delete(${r.id});document.querySelector('#count').textContent='${rr.length} risultati · '+selected.size+' selezionati'"></td>${cols.map(k=>`<td>${esc(r[k])}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
async function createPractice(){if(!selected.size)return message('Seleziona almeno un incarico.',true);let title=prompt('Titolo della pratica');if(!title?.trim())return;let notes=prompt('Motivazione o note della proposta (facoltative)')||'';let p=await api('/create',{title,notes,ids:[...selected]});await openPractice(p.id)}
function accountMenu(){const user=S.auth;if(!user)return;document.querySelector('#backupbutton').hidden=user.role!=='admin';document.querySelector('#accountmenu').innerHTML=`<span class="muted">${esc(user.username)}</span>${user.role==='admin'?'<button class="secondary" onclick="usersPage()">Utenti</button>':''}${user.external?'<button class="secondary" onclick="passwordForm()">Cambia password</button><button class="secondary" onclick="logout()">Esci</button>':''}`}
async function logout(){await api('/logout');location.reload()}
async function usersPage(){try{const users=await api('/users');document.querySelector('#view').innerHTML=`<section class="panel"><h2>Utenti INCA</h2><p>Gli utenti condividono archivio e pratiche. Gli amministratori gestiscono anche utenti, importazioni e backup.</p><p class="muted">Per il collegamento esterno: https://inca.archis.uk. Crea prima un amministratore.</p><h3>Nuovo utente</h3><form id="newuser"><div class="filters"><label>Nome utente<input name="username" required minlength="3" maxlength="64" autocomplete="off" pattern="[a-zA-Z0-9][a-zA-Z0-9._-]{2,63}"></label><label>Password (almeno 12 caratteri)<input name="password" type="password" required minlength="12" maxlength="1024" autocomplete="new-password"></label><label>Ruolo<select name="role"><option value="admin">Amministratore</option><option value="operator" ${users.length?'selected':''}>Operatore</option></select></label></div><button>Crea utente</button><p id="usererror" role="alert"></p></form><h3>Account esistenti</h3><table><thead><tr><th>Utente</th><th>Ruolo</th><th>Stato</th><th>Azioni</th></tr></thead><tbody>${users.map(u=>`<tr><td>${esc(u.username)}</td><td>${u.role==='admin'?'Amministratore':'Operatore'}</td><td>${u.enabled?'Attivo':'Disattivato'}</td><td><button class="secondary" onclick="passwordForm(${u.id})">Reimposta password</button> <button class="secondary" onclick="setUserEnabled(${u.id},${!u.enabled})">${u.enabled?'Disattiva':'Riattiva'}</button></td></tr>`).join('')}</tbody></table></section>`;document.querySelector('#newuser').onsubmit=async e=>{e.preventDefault();let data=Object.fromEntries(new FormData(e.target));try{await api('/create-user',data);await usersPage();message('Utente creato.')}catch(err){document.querySelector('#usererror').textContent=err.message}}}catch(e){message(e.message,true)}}
async function setUserEnabled(id,enabled){if(!confirm(enabled?'Riattivare questo account?':'Disattivare questo account e terminare le sue sessioni?'))return;try{await api('/update-user',{id,enabled});await usersPage()}catch(e){message(e.message,true)}}
function passwordForm(id=null){let d=document.querySelector('#editor');dirty=false;d.innerHTML=`<h2>${id===null?'Cambia password':'Reimposta password'}</h2><form id="passwordform">${id===null?'<label>Password attuale<input name="current_password" type="password" required autocomplete="current-password"></label>':''}<label>Nuova password<input name="password" type="password" required minlength="12" maxlength="1024" autocomplete="new-password"></label><label>Conferma nuova password<input name="confirmation" type="password" required minlength="12" maxlength="1024" autocomplete="new-password"></label><p class="muted">Almeno 12 caratteri. Le sessioni dell’utente verranno terminate.</p><button>Salva password</button> <button type="button" class="secondary" onclick="closeEditor()">Annulla</button><p id="passworderror" role="alert"></p></form>`;d.showModal();document.querySelector('#passwordform').onsubmit=async e=>{e.preventDefault();let data=Object.fromEntries(new FormData(e.target));if(data.password!==data.confirmation){document.querySelector('#passworderror').textContent='Le password non coincidono.';return}try{if(id===null)await api('/change-password',data);else await api('/update-user',{id,password:data.password});d.close();if(id===null||(S.auth?.external&&S.auth.id===id))location.reload();else message('Password reimpostata.')}catch(err){document.querySelector('#passworderror').textContent=err.message}}}
async function practices(){S=await api('/state');accountMenu();document.querySelector('#view').innerHTML=`<section class="panel"><h2>Pratiche salvate</h2><p class="muted">Proposte di lavoro, senza approvazione automatica né aggiornamento del sistema di Ateneo.</p>${S.practices.length?S.practices.map(p=>`<div class="bar" style="padding:12px;border-bottom:1px solid #eee"><button onclick="openPractice(${p.id})">${esc(p.title)}</button><button class="secondary" onclick="openPractice(${p.id})">Modifica</button><button class="secondary" onclick="deletePractice(${p.id})">Elimina</button><span>${esc(p.created)}</span><span class="muted">${esc(p.notes)}</span></div>`).join(''):'Nessuna pratica. Seleziona gli incarichi nell’archivio.'}</section>`}
function diff(x){return [...new Set([...Object.keys(x.before),...Object.keys(x.after)])].filter(k=>String(x.before[k]??'')!==String(x.after[k]??''))}
async function editPracticeDetails(){let title=prompt('Titolo della pratica',active.practice.title);if(title===null)return;let notes=prompt('Note della pratica',active.practice.notes||'');if(notes===null)return;try{await api('/update-practice',{id:active.practice.id,title,notes});await openPractice(active.practice.id);message('Pratica aggiornata.')}catch(e){message(e.message,true)}}
async function deletePractice(id){let p=active?.practice.id===id?active.practice:S.practices.find(p=>p.id===id);if(!confirm('Eliminare definitivamente la pratica «'+(p?.title||id)+'» e il relativo storico? Il report importato rimane invariato.'))return;try{await api('/delete-practice',{id});active=null;await practices();message('Pratica eliminata.')}catch(e){message(e.message,true)}}
async function openPractice(id){active=await api('/practice',{id});drawPractice()}
function drawPractice(){document.querySelector('#view').innerHTML=`<section class="panel"><h2>${esc(active.practice.title)}</h2><p>${esc(active.practice.notes)}</p><p class="muted">Proposta di modifica · Originale importato conservato · ${esc(active.practice.created)}</p><div class="bar noprint"><button class="secondary" onclick="editPracticeDetails()">Modifica titolo e note</button><button class="secondary" onclick="deletePractice(${active.practice.id})">Elimina pratica</button><button onclick="window.print()">Stampa / Salva PDF</button><button onclick="exportExcel()">Scarica proposta Excel</button><button class="secondary" onclick="exportCSV()">Esporta confronto CSV per Excel</button><label><input id="only" type="checkbox" onchange="drawItems()"> Solo campi modificati</label></div></section>${(active.hour_checks||[]).map(t=>`<p class="warning">${esc(t)}</p>`).join('')}${teacherReferenceHTML()}<div id="items"></div>`;drawItems()}
function originalSaturation(item){let value=item.before['SATURAZIONE DOCENTE A PREVENTIVO'];return value===undefined||value===null||value===''?'[DA VERIFICARE]':value}
function drawItems(){let only=document.querySelector('#only').checked;document.querySelector('#items').innerHTML=active.items.map(x=>{let changed=diff(x),context=x.kind==='new'?x.after:x.before,keys=x.kind==='new'?S.edit:(only?changed:[...new Set([...S.edit,...changed])]);return `<section class="panel"><div class="bar"><h3>${esc(context.MODULO||context.INSEGNAMENTO)}</h3><span class="pill">${x.kind==='new'?'Nuova copertura proposta':changed.length+' campi modificati'}</span><button onclick="edit(${x.id})">Modifica proposta</button>${x.kind!=='new'?`<button class="secondary" onclick="splitForm(${x.id})">Suddividi ore di lezione</button>`:''}</div><p>${esc(context.CDS)} · ${esc(context['ANNO ACCADEMICO'])}<br><span class="muted">${esc(context.INSEGNAMENTO)} · UL: ${esc(context.UL||'—')} · ID copertura: ${esc(x.before['ID COPERTURA']||'assente')}</span></p><p><strong>Saturazione docente a preventivo — premodifica:</strong> ${esc(originalSaturation(x))}<br><span class="muted">Valore del docente nell’originale importato, non ricalcolato sulla proposta.</span></p>${x.note?`<p style="white-space:pre-wrap"><strong>Note della modifica:</strong> ${esc(x.note)}</p>`:''}${x.warnings.map(w=>`<div class="warning">${esc(w)}</div>`).join('')}<table><thead><tr><th style="width:30%">Campo</th><th style="width:35%">Prima · Originale</th><th>Dopo · Proposta</th></tr></thead><tbody>${keys.map(k=>`<tr class="${changed.includes(k)?'changed':''}"><td>${esc(k)}</td><td>${esc(x.before[k]??'')||'—'}</td><td>${esc(x.after[k]??'')||'—'}</td></tr>`).join('')||'<tr><td colspan="3">Nessuna differenza inserita.</td></tr>'}</tbody></table><details class="noprint"><summary>Storico salvataggi (${x.history.length})</summary>${x.history.map(h=>`<details><summary>${esc(h.created)} · proposta precedente</summary><pre style="white-space:pre-wrap">${esc(JSON.stringify(JSON.parse(h.body),null,2))}</pre></details>`).join('')||'Nessun salvataggio precedente.'}</details></section>`}).join('')}
function edit(id){current=active.items.find(x=>x.id===id);dirty=false;let d=document.querySelector('#editor');d.innerHTML=`<h2>Modifica proposta</h2><p>${esc(current.after.MODULO||current.after.INSEGNAMENTO)}</p><div class="bar"><button type="button" onclick="unlink()">Togli mutuazione e libera docente</button><span class="muted">Il titolo di affidamento va scelto esplicitamente.</span></div><p class="warning">I campi vuoti restano vuoti. Sono modificabili solo i nove campi previsti. Per aggiornare anche matricola e afferenza usa la selezione dall’archivio docenti. Scrivendo manualmente nome e cognome questi dati non vengono aggiornati.</p><form id="form">${teacherPicker()}<div class="editgrid">${S.edit.map((k,i)=>`<label>${esc(k)}<input id="e${i}" ${k.startsWith('PERIODO ')?'type="date"':''} value="${esc(current.after[k]??'')}" oninput="dirty=true" ${k==='COGNOME DOCENTE'?'list="teachers"':''}></label>`).join('')}</div><label>Note della modifica<textarea id="changenote" rows="4" style="width:100%" oninput="dirty=true">${esc(current.note||'')}</textarea></label><datalist id="teachers">${[...new Set(rows.map(r=>r['COGNOME DOCENTE']).filter(Boolean))].sort().map(v=>`<option value="${esc(v)}">`).join('')}</datalist><p class="muted">Mutuazione: 1 = sì, 0 = no. Ore e CFU: numeri non negativi. Negli incarichi suddivisi, le variazioni del totale aggiornano le ore di lezione; il totale della suddivisione viene controllato.</p><div class="bar"><button type="submit">Salva proposta</button><button type="button" class="secondary" onclick="closeEditor()">Annulla</button><span id="editerror" role="alert"></span></div></form>`;d.showModal();document.querySelector('#form').onsubmit=async e=>{e.preventDefault();try{let values={};S.edit.forEach((k,i)=>values[k]=document.querySelector('#e'+i).value);await api('/save',{id:current.id,version:current.version,values,teacher_id:document.querySelector('#teacherpick')?.value||null,note:document.querySelector('#changenote').value});dirty=false;d.close();await openPractice(active.practice.id);message('Proposta salvata in INCA.');}catch(err){document.querySelector('#editerror').textContent=err.message}}}
let splitSource=null;
function splitForm(id){splitSource=active.items.find(x=>x.id===id);dirty=false;let d=document.querySelector('#editor');d.innerHTML=`<h2>Suddividi ore di lezione</h2><p>${esc(splitSource.after.MODULO||splitSource.after.INSEGNAMENTO)} · ${esc(splitSource.after['NOME DOCENTE'])} ${esc(splitSource.after['COGNOME DOCENTE'])}</p><p>Totale attuale dell’incarico: ${esc(splitSource.after['TOT ORE PREVISTE']??'[DA VERIFICARE]')} ore.</p><form id="splitform"><label>Ore di lezione attuali (verificare il dato)<input id="lecturehours" type="number" min="0" step="any" required value="${esc(splitSource.after.OREPREVLEZ??'')}"></label><div id="allocations"></div><button class="secondary" type="button" onclick="addAllocation()">Aggiungi destinatario</button><label>Motivazione e adempimenti da verificare<textarea id="splitnote" rows="4" style="width:100%"></textarea></label><p class="warning">Vengono create nuove coperture proposte. Se il destinatario ha già un incarico sul modulo, verificarlo prima di creare una nuova riga. I CFU non sono calcolati dalle ore; titolo, dati anagrafici e formalizzazione devono essere verificati.</p><p id="splitpreview"></p><button>Salva suddivisione</button> <button class="secondary" type="button" onclick="closeEditor()">Annulla</button><p id="spliterror" role="alert"></p></form>`;addAllocation();d.showModal();document.querySelector('#splitform').oninput=()=>{dirty=true;splitPreview()};document.querySelector('#splitform').onsubmit=async e=>{e.preventDefault();let allocations=[...document.querySelectorAll('.allocation')].map(el=>Object.fromEntries(['name','surname','hours','title','teacher_id'].map(k=>[k,el.querySelector('[name="'+k+'"]')?.value||''])));try{await api('/split',{id:splitSource.id,version:splitSource.version,lecture_hours:document.querySelector('#lecturehours').value,allocations,note:document.querySelector('#splitnote').value});dirty=false;d.close();await openPractice(active.practice.id);message('Suddivisione salvata nella proposta. Verifica CFU e titolo dei nuovi incarichi.')}catch(err){document.querySelector('#spliterror').textContent=err.message}}}
function addAllocation(){document.querySelector('#allocations').insertAdjacentHTML('beforeend',`<fieldset class="allocation" style="margin:14px 0;border:1px solid #b9c9d3"><legend>Nuovo incarico proposto</legend>${allocationPicker()}<div class="filters"><label>Nome<input name="name" autocomplete="off"></label><label>Cognome<input name="surname" required autocomplete="off"></label><label>Ore cedute<input name="hours" type="number" min="0.01" step="any" required></label><label>Titolo affidamento<input name="title" placeholder="Da verificare"></label></div><button type="button" class="secondary" onclick="this.closest('.allocation').remove();dirty=true;splitPreview()">Rimuovi destinatario</button></fieldset>`);dirty=true;splitPreview()}
function splitPreview(){let total=[...document.querySelectorAll('.allocation input[name="hours"]')].reduce((sum,e)=>sum+(Number(e.value)||0),0),remaining=Number(splitSource.after['TOT ORE PREVISTE'])-total;document.querySelector('#splitpreview').textContent='Ore da redistribuire: '+total+' · Ore residue al docente originario: '+remaining}
function unlink(){const set=(k,v)=>document.querySelector('#e'+S.edit.indexOf(k)).value=v;set('MUTUAZIONE','0');set('PADRE MUTUAZIONE','');set('NOME DOCENTE','');set('COGNOME DOCENTE','');dirty=true}
function closeEditor(){if(!dirty||confirm('Chiudere senza salvare le modifiche?')){dirty=false;document.querySelector('#editor').close()}}
document.querySelector('#editor').addEventListener('cancel',e=>{e.preventDefault();closeEditor()});window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
function download(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function practiceFilename(){let name=String(active.practice.title||'').normalize('NFC').replace(/[<>:"/\\|?*\x00-\x1f]/g,'_').replace(/[. ]+$/g,'').trim().slice(0,160);if(!name)name='Pratica_'+active.practice.id;if(/^(con|prn|aux|nul|com[1-9]|lpt[1-9])(?:\.|$)/i.test(name))name='_'+name;return name}
async function exportExcel(){try{let r=await fetch('export-xlsx',{method:'POST',headers:{'X-Token':TOKEN,'Content-Type':'application/json'},body:JSON.stringify({id:active.practice.id})});if(!r.ok)throw Error((await r.json()).error);download(await r.blob(),practiceFilename()+'.xlsx')}catch(e){message(e.message,true)}}
function exportCSV(){let lines=[['Pratica','ID copertura','CDS','Insegnamento','Modulo','Campo','Prima','Dopo','Modificato']];active.items.forEach(x=>{let keys=[...new Set([...S.edit,...diff(x)])];keys.forEach(k=>lines.push([active.practice.title,x.before['ID COPERTURA'],x.before.CDS,x.before.INSEGNAMENTO,x.before.MODULO,k,x.before[k],x.after[k],diff(x).includes(k)?'SI':'NO']))});let cell=v=>{let s=String(v??'');if(/^[=+@\-\t\r]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"'};download(new Blob(['\ufeff'+lines.map(l=>l.map(cell).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'}),practiceFilename()+'.csv')}
async function backup(){let r=await fetch('backup',{method:'POST',headers:{'X-Token':TOKEN},body:'{}'});if(!r.ok)throw Error('Backup non riuscito');download(await r.blob(),'Backup_INCA.zip');message('Backup scaricato: conserva lo ZIP in una cartella sicura.')}
let teacherArchive=null;
async function teachersPage(){
 S=await api('/state');accountMenu();teacherArchive=await api('/teachers');
 document.querySelector('#view').innerHTML=`<section class="panel"><h2>Docenti e carichi didattici</h2><p>Carichi complessivi in ore, indipendenti dai corsi visibili nell’archivio. Le proposte non aggiornano questi valori.</p>${S.auth?.role==='admin'?`<form id="teacherupload"><div class="filters"><label>Anno di riferimento<input id="teacheryear" placeholder="2026/2027" required pattern="[0-9]{4}/[0-9]{4}" value="${esc(teacherArchive?.year||'')}"></label><label>Data di riferimento del report (se nota)<input type="date" id="teacherdate"></label><label>Report docenti .xls<input type="file" id="teacherfile" accept=".xls" required></label></div><p class="muted">Il caricamento sostituisce l’elenco corrente. I riferimenti già conservati nelle pratiche restano invariati. Gli abbinamenti vanno confermati sul nuovo elenco.</p><button>Importa elenco docenti</button></form>`:''}<p>${teacherArchive?`${esc(teacherArchive.name)} · a.a. ${esc(teacherArchive.year)} · riferimento ${esc(teacherArchive.reference_date||'[DA VERIFICARE]')} · importato ${esc(teacherArchive.created)}`:'Nessun report docenti importato.'}</p><label>Ricerca per nome, cognome, SSD o dipartimento<input id="teachersearch" oninput="renderTeachers()"></label><p id="teachercount" class="muted"></p><div id="teacherlist" class="scroll"></div></section>`;
 if(S.auth?.role==='admin')document.querySelector('#teacherupload').onsubmit=async e=>{e.preventDefault();let f=document.querySelector('#teacherfile').files[0];if(!f)return;if(teacherArchive&&!confirm('Sostituire l’archivio docenti corrente? I riferimenti delle pratiche salvate saranno conservati.'))return;try{let r=await fetch('import-teachers',{method:'POST',headers:{'X-Token':TOKEN,'X-Name':encodeURIComponent(f.name),'X-Year':document.querySelector('#teacheryear').value,'X-Date':document.querySelector('#teacherdate').value},body:f});let j=await r.json();if(!r.ok)throw Error(j.error);await teachersPage();message(j.count+' posizioni docenti importate.')}catch(err){message(err.message,true)}};
 renderTeachers();
}
function renderTeachers(){
 let query=searchKey(document.querySelector('#teachersearch').value),all=teacherArchive?.rows||[],list=all.filter(t=>['NOME','COGNOME','SSD','SSD SETTORE NUOVO','DIPARTIMENTO/SCUOLA'].some(k=>searchKey(t[k]).includes(query)));
 document.querySelector('#teachercount').textContent=`${list.length} risultati · ${all.filter(t=>t.matricola).length} abbinamenti confermati su ${all.length}`;
 const hours=v=>v===null?'[DA VERIFICARE]':esc(v);
 document.querySelector('#teacherlist').innerHTML=`<table><thead><tr><th>Docente</th><th>Dipartimento / qualifica / SSD</th><th>Potenziale</th><th>Preventivo</th><th>Consuntivo</th><th>Collegamento alla matricola</th></tr></thead><tbody>${list.map(t=>`<tr><td>${esc(t.COGNOME)} ${esc(t.NOME)}</td><td>${esc(t['DIPARTIMENTO/SCUOLA'])}<br>${esc(t.QUALIFICA)}<br>${esc(t.SSD)} · ${esc(t['SSD SETTORE NUOVO'])}</td><td>${hours(t['ORE POTENZIALE'])}</td><td>${hours(t['ORE CARICO PREVENTIVO'])}</td><td>${hours(t['ORE CARICO CONSUNTIVO'])}</td><td>${t.placeholder?'Posizione futura: non selezionabile come docente':t.matricola?`Confermato: ${esc(t.matricola)}${S.auth?.role==='admin'?` <button class="secondary" onclick="linkTeacher(${t.id},'')">Rimuovi collegamento</button>`:''}`:t.candidates.length?`<span class="muted">${t.candidates.length===1?'Candidato da confermare':'Più matricole: verificare l’identità'}</span>${t.candidates.map(c=>`<p>${esc(c.matricola)} · ${esc(c.details)} ${S.auth?.role==='admin'?`<button class="secondary" data-matricola="${esc(c.matricola)}" onclick="linkTeacher(${t.id},this.dataset.matricola)">Conferma</button>`:''}</p>`).join('')}`:'Nessuna corrispondenza nel report coperture corrente [DA VERIFICARE]'}</td></tr>`).join('')}</tbody></table>`;
}
async function linkTeacher(id,matricola){try{await api('/link-teacher',{report_id:teacherArchive.id,teacher_id:id,matricola});let query=document.querySelector('#teachersearch').value;teacherArchive=await api('/teachers');document.querySelector('#teachersearch').value=query;renderTeachers();message('Collegamento aggiornato nell’archivio corrente; i riferimenti delle pratiche restano invariati.')}catch(e){message(e.message,true)}}
function teacherReferenceHTML(){
 if(!active.teacher_reference)return `<section class="panel"><h3>Potenziale e carichi docenti</h3><p>Nessun riferimento docenti conservato per questa pratica.</p><p class="muted">Conferma prima gli abbinamenti in Docenti e carichi. Il riferimento acquisito rimane fisso, anche dopo nuovi caricamenti.</p>${active.teacher_report_available?'<button class="noprint" onclick="attachTeachers()">Acquisisci riferimento docenti</button>':'<p>Importa prima l’elenco in Docenti e carichi.</p>'}</section>`;
 return `<section class="panel"><h3>Potenziale e carichi docenti — riferimento conservato</h3>${active.teacher_report_newer?'<p class="warning noprint">L’archivio corrente è stato aggiornato. Questa pratica mantiene il riferimento acquisito.</p>':''}${(active.teacher_summary||[]).map(t=>`<p>${esc(t)}</p>`).join('')}<p class="muted">Il preventivo dell’elenco docenti potrebbe già comprendere una variazione. Non viene sommato automaticamente alle ore della proposta.</p></section>`;
}
async function attachTeachers(){if(!confirm('Acquisire l’elenco docenti corrente come riferimento fisso della pratica? Verifica prima gli abbinamenti in Docenti e carichi.'))return;try{await api('/attach-teachers',{id:active.practice.id});await openPractice(active.practice.id)}catch(e){message(e.message,true)}}
function teacherPicker(){let ts=(active.teacher_reference?.rows||[]).filter(t=>t.matricola&&!t.placeholder);return ts.length?`<label>Seleziona un docente dall’archivio confermato<select id="teacherpick" onchange="pickTeacher()"><option value="">Mantieni compilazione attuale / manuale</option>${ts.map(t=>`<option value="${t.id}">${esc(t.COGNOME)} ${esc(t.NOME)} · ${esc(t.matricola)}</option>`).join('')}</select></label><p class="muted">La selezione aggiorna nome, cognome, matricola e afferenza; il codice fiscale precedente viene rimosso. I carichi di riferimento non vengono ricalcolati.</p>`:''}
function allocationPicker(){let ts=(active.teacher_reference?.rows||[]).filter(t=>t.matricola&&!t.placeholder);return ts.length?`<label>Docente confermato<select name="teacher_id" onchange="pickAllocation(this)"><option value="">Compilazione manuale</option>${ts.map(t=>`<option value="${t.id}">${esc(t.COGNOME)} ${esc(t.NOME)} · ${esc(t.matricola)}</option>`).join('')}</select></label>`:''}
function pickAllocation(el){let t=active.teacher_reference.rows.find(t=>String(t.id)===el.value);if(!t)return;let f=el.closest('.allocation');f.querySelector('[name="name"]').value=t.NOME;f.querySelector('[name="surname"]').value=t.COGNOME;dirty=true}
function pickTeacher(){let t=active.teacher_reference.rows.find(t=>String(t.id)===document.querySelector('#teacherpick').value);if(!t)return;for(let [k,v] of [['NOME DOCENTE',t.NOME],['COGNOME DOCENTE',t.COGNOME]])document.querySelector('#e'+S.edit.indexOf(k)).value=v;dirty=true}

archive();
</script></html>
